name: kimi-market-release

on:
  push:
    branches:
      - main
    paths:
      - "kimi-market/**"
      - ".github/workflows/kimi-market-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rolling-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate portable skills and runtimes
        run: |
          node tooling/goal-dag/sync-thread-skills.mjs
          node tooling/goal-dag/build.mjs
          node tooling/owner-registry/build.mjs
          node tooling/workflow-config/build.mjs
          git diff --exit-code -- claude-code-market codex-market kimi-market

      - name: Validate workflow contracts
        run: |
          python3 -m unittest \
            tests.test_goal_dag_cli \
            tests.test_kimi_goal_dag_cli \
            tests.test_owner_registry_cli \
            tests.test_sub_thread_skill_contract \
            tests.test_kimi_sub_thread_contract \
            tests.test_start_dag_dashboard_skill

      - name: Build plugin zip
        run: |
          cd kimi-market/plugins
          zip -r "$GITHUB_WORKSPACE/ghost-agent-workflow-kimi.zip" ghost-agent-workflow -x "*/.DS_Store"

      - name: Update rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view kimi-latest >/dev/null 2>&1; then
            gh release create kimi-latest \
              --title "kimi-market latest" \
              --notes "Rolling build of the Kimi Code ghost-agent-workflow plugin from main. Install in Kimi Code: /plugins install https://github.com/Ghost233/ghost-agent-market/releases/download/kimi-latest/ghost-agent-workflow-kimi.zip"
          fi
          gh release upload kimi-latest "$GITHUB_WORKSPACE/ghost-agent-workflow-kimi.zip" --clobber
