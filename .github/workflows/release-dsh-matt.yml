name: Release DSH Matt Bundle

on:
  push:
    tags: ['dsh-ghost-matt-skills-v*']
  pull_request:
    paths:
      - '.github/workflows/release-dsh-matt.yml'
      - 'dsh-market/**'
      - 'tooling/*dsh*.mjs'
      - 'tests/test_dsh_matt_bundle.mjs'
      - 'tests/dsh-runtime/**'
      - 'codex-market/plugins/mattpocock-skills-zh/skills/**'
      - 'codex-market/plugins/ghost-agent-skills/skills/ghost-matt-*/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsh-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.12.0'
      - name: Install locked DSH 0.1.6-alpha.1 runtime
        run: npm ci --prefix tests/dsh-runtime --ignore-scripts --no-audit --no-fund
      - name: Build, install and verify complete bundle
        run: node tooling/verify-dsh-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsh-release
          path: dist/dsh-release/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dsh-release
          path: release
      - name: Publish new release only; never replace existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^dsh-ghost-matt-skills-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#dsh-ghost-matt-skills-v}"
          asset="dsh-ghost-matt-skills-${version}.tgz"
          test -f "$asset"
          sha256sum --check SHA256SUMS
          # API errors fail closed; inspect all pages, including drafts visible to this token.
          existing=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')
          if printf '%s\n' "$existing" | grep -Fxq "$RELEASE_TAG"; then
            echo "Release already exists; refusing to overwrite: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$asset" SHA256SUMS --verify-tag --latest=false \
            --title "DSH Ghost Matt Skills $version" --notes-file release-notes.md
          # Public unauthenticated download must match exactly what was validated.
          download_dir=$(mktemp -d)
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$asset" \
            --output "$download_dir/$asset"
          cmp "$asset" "$download_dir/$asset"
